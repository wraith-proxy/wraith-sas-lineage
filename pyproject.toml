[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wraith-sas-lineage"
version = "0.4.0"
description = "SAS lineage extraction, schema mapping, and ODCS contract generation for the Ghost Stack."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Peoples", email = "hello@thomaspeoples.com" },
]
keywords = [
    "sas",
    "lineage",
    "data-contracts",
    "odcs",
    "ghost-stack",
    "analytics-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "flask>=3.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://git.thomaspeoples.com/thomaspeoples/wraith-sas-lineage"
Repository = "https://git.thomaspeoples.com/thomaspeoples/wraith-sas-lineage.git"
Documentation = "https://www.thomaspeoples.com/gitea-repos/wraith-sas-lineage/"
Issues = "https://git.thomaspeoples.com/thomaspeoples/wraith-sas-lineage/issues"
Changelog = "https://git.thomaspeoples.com/thomaspeoples/wraith-sas-lineage/src/branch/main/CHANGELOG.md"

[project.scripts]
sas-parse = "sas_lineage.parser.cli:main"
sas-map = "sas_lineage.schema_mapper.cli:main"
sas-ui = "sas_lineage.web_ui.app:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "detect-secrets",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "poethepoet",
    "pydoc-markdown",
    "pymdown-extensions",
    "typer",
    "genbadge[coverage]>=1.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sas_lineage"]

[tool.hatch.build.targets.sdist]
exclude = [".claude", "*.sas"]

[tool.poe.tasks]
setup = "python tasks.py"
test = "pytest"
test-ci = "pytest --cov=src tests/ --cov-report=term-missing --cov-fail-under=80"
lint = "ruff check ."
format = "ruff format ."
tidy = ["lint", "format"]
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"

[tool.pydoc-markdown]
loaders = [
    { type = "python", search_path = ["src/"] },
]

[[tool.pydoc-markdown.processors]]
type = "filter"
documented_only = true
skip_empty_modules = true

[[tool.pydoc-markdown.processors]]
type = "smart"

[[tool.pydoc-markdown.processors]]
type = "crossref"

[tool.pydoc-markdown.renderer]
type = "markdown"
render_toc = true
render_toc_title = "Contents"
descriptive_class_title = false
add_module_prefix = false
filename = "docs/api.md"

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--tb=short",
    "--strict-markers",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "src/sas_lineage/__init__.py",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
